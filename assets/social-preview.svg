<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10232b"/>
      <stop offset="1" stop-color="#060e12"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <svg x="110" y="150" width="340" height="340" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a33"/>
      <stop offset="1" stop-color="#08141a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6b4"/>
      <stop offset="1" stop-color="#1f8fd6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="#3ee6b4" stroke-opacity="0.22" stroke-width="4"/>

  <!-- the terminal side: prompt and output lines, then the pane divider -->
  <g stroke="#5f8a94" stroke-width="18" stroke-linecap="round">
    <path d="M78 150 l26 22 -26 22" fill="none" stroke="#3ee6b4" stroke-linejoin="round"/>
    <line x1="78" y1="250" x2="150" y2="250"/>
    <line x1="78" y1="300" x2="130" y2="300"/>
    <line x1="78" y1="350" x2="156" y2="350"/>
  </g>
  <line x1="196" y1="70" x2="196" y2="442" stroke="#5f8a94" stroke-opacity="0.55" stroke-width="6"/>

  <!-- the phone in the pane -->
  <rect x="232" y="70" width="210" height="372" rx="44" fill="#e9f3f5"/>
  <rect x="246" y="84" width="182" height="344" rx="32" fill="url(#screen)"/>
  <rect x="306" y="98" width="62" height="16" rx="8" fill="#e9f3f5"/>

  <!-- the tap -->
  <circle cx="350" cy="300" r="64" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="350" cy="300" r="64" fill="none" stroke="#ffffff" stroke-width="9" stroke-opacity="0.9"/>
  <circle cx="350" cy="300" r="34" fill="#ff7a59"/>
</svg>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="540" y="300" font-size="112" font-weight="700" fill="#eef8f9" letter-spacing="-2">simpane</text>
    <text x="544" y="370" font-size="38" fill="#a9c6cc">Your phone simulator, live in Claude Code</text>
    <g font-size="28" font-weight="600">
      <circle cx="556" cy="436" r="10" fill="#3ee6b4"/><text x="576" y="446" fill="#3ee6b4">tap</text>
      <circle cx="660" cy="436" r="10" fill="#4fb6f0"/><text x="680" y="446" fill="#4fb6f0">swipe</text>
      <circle cx="794" cy="436" r="10" fill="#ff7a59"/><text x="814" y="446" fill="#ff7a59">type</text>
    </g>
  </g>
</svg>
